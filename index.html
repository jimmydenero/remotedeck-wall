// ---------- phones + randomized scrolling ----------
const MODELS=['iPhone 15 Pro','iPhone 15','iPhone 14 Pro','iPhone 14','iPhone 13','iPhone SE'];
const P=[];const t00=performance.now();

function nearBad(i,k){const c=i%COLS,r=(i/COLS)|0;for(let rr=Math.max(0,r-NBR);rr<=Math.min(ROWS-1,r+NBR);rr++)for(let cc=Math.max(0,c-NBC);cc<=Math.min(COLS-1,c+NBC);cc++){const j=rr*COLS+cc;if(j===i||j>=P.length)continue;const q=P[j];if(q.k===k||q.nk===k)return true}return false}

const CUM=new Float32Array(NCLIP);{let s=0;for(let k=0;k<NCLIP;k++){s+=1/Math.sqrt(UC[REELS[k].u]);CUM[k]=s}}

  for(let t=0;t<40;t++){k=draw1(rand);if(k!==cur&&!nearBad(i,k))return k}
  do{k=(rand()*NCLIP)|0}while(k===cur&&NCLIP>1);return k}
for(let i=0;i<N;i++){const st=R();const k=pickFor(i,[],-1,R);
  P.push({i,h:[k],k,fv:(R()*NFV)|0,shown:t00-R()*20000,nk:k,pk:-1,sw:-1,dur:400,kind:0,dir:1,amp:1,ez:0,burst:0,nxt:t00+400+R()*12000,s:st<.9?1:(st<.995?0:2),bat:55+((R()*44)|0),m2:MODELS[(R()*R()*6)|0],up:3+((R()*80)|0),mb:180+((R()*420)|0)})}
const EZ=[t=>1-Math.pow(1-t,3),t=>1-Math.pow(1-t,4),t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,t=>1-Math.pow(1-t,2.2)];

function swipeK(p,now){if(p.sw<0)return 0;const t=Math.min(1,Math.max(0,(now-p.sw)/p.dur));if(p.kind===1)return p.dir*p.amp*Math.sin(Math.PI*t);return p.dir*EZ[p.ez](t)}
const rnd=(a,b)=>a+Math.random()*(b-a);

function idle(i){const r=Math.random();const base=r<.18?rnd(1200,3000):r<.75?rnd(3000,9000):r<.93?rnd(9000,17000):rnd(17000,30000);return i===sel?base+4000:base}
function startSwipe(p,i,now){const r=Math.random();p.sw=now;p.ez=(Math.random()*EZ.length)|0;

  if(p.sw>=0){if(now-p.sw>=p.dur){if(p.kind===0){p.pk=p.k;p.k=p.nk;p.shown=now;if(p.h[p.h.length-1]!==p.k){p.h.push(p.k);if(p.h.length>HIST)p.h.shift()}}p.nk=p.k;p.sw=-1;p.nxt=now+(p.burst>0?rnd(90,380):idle(i))}}

// camera
let cam={x:WW/2,y:WH/2,s:.2},minS=.02,startS=.2,anim=null,sel=-1,hov=-1,dirty=true,touched=false;
const X0=-GX/2,X1=COLS*PX-GX/2,Y0=-14,Y1=ROWS*PY-6;
function resize(){const b=cv.getBoundingClientRect();W=b.width;H=b.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);minS=Math.max(W/(X1-X0),H/(Y1-Y0));const n=W<=760?4:8;startS=W/(n*PX);if(H/(PY*startS)<2.15)startS=H/(2.15*PY);dirty=true}
function startView(){const nv=W/(PX*startS),c0=Math.floor(COLS/2-nv/2),r0=Math.floor(ROWS/2)-2;cam={x:c0*PX-GX/2+W/2/startS,y:r0*PY-14+H/2/startS,s:startS};clampCam()}
function clampCam(){const mx=(H*1.25)/CH;cam.s=Math.max(minS,Math.min(mx,cam.s));const hw=W/2/cam.s,hh=H/2/cam.s;

const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function flyTo(x,y,s,ms){anim={a:{...cam},b:{x,y,s},t0:performance.now(),ms:ms||900}}
function phonePos(i){return{x:(i%COLS)*PX,y:Math.floor(i/COLS)*PY}}
function focus(i,ms){sel=i;touched=true;kick();const p=phonePos(i);const n=W<=760;const s=(H*(n?.42:.8))/CH;const panel=n?0:150;flyTo(p.x+CW/2+panel/s,p.y+CH/2+(n?H*.23/s:0),s,ms||1000);clipFor(P[i].k);showPanel();dirty=true}
function fitAll(ms){sel=-1;showPanel();flyTo((X0+X1)/2,(Y0+Y1)/2,minS,ms||1100)}
function hit(mx,my){const wx=(mx-W/2)/cam.s+cam.x,wy=(my-H/2)/cam.s+cam.y;const c=Math.floor(wx/PX),r=Math.floor(wy/PY);if(c<0||r<0||c>=COLS||r>=ROWS)return-1;if(wx-c*PX>CW||wy-r*PY>CH)return-1;const i=r*COLS+c;return i<N?i:-1}
// draw
function draw(now){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const s=cam.s,ox=W/2-cam.x*s,oy=H/2-cam.y*s;

  const c0=Math.max(0,Math.floor(-ox/s/PX)),c1=Math.min(COLS-1,Math.floor((W-ox)/s/PX)),r0=Math.max(0,Math.floor(-oy/s/PY)),r1=Math.min(ROWS-1,Math.floor((H-oy)/s/PY));
  const pw=CW*s,ph=CH*s,dev=pw*dpr;let lv=0;while(lv<OV[0].length-1&&OV[0][lv+1].width>=dev*.95)lv++;buildBudget=28;const li=infoLevel(dev*.956);

  else for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const i=r*COLS+c;const p=P[i],x=ox+c*PX*s,y=oy+r*PY*s,o=swipeK(p,now);

    if(i===sel&&dev>380){ctx.save();ctx.translate(x,y);ctx.scale(s,s);overlay(ctx,p.fv);ctx.restore()}
    else ctx.drawImage(dev>380?hiOv(p.fv):OV[p.fv][lv],x,y,pw,ph);
    if(pw>5){ctx.fillStyle=DC[p.s];ctx.beginPath();ctx.arc(x+pw/2-(pw>70?pw*.28:0),y+dotY,dotR,0,7);ctx.fill();
      if(pw>70){ctx.fillStyle='#969eae';ctx.font=`500 ${Math.min(15,9*s+3)}px ${FONT}`;ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText('RD-'+String(i+1).padStart(5,'0'),x+pw/2-pw*.28+dotR*2.2,y+dotY+.5)}}}
  ctx.textAlign='left';
  const ring=(i,col,wid)=>{if(i<0)return;const q=phonePos(i),x=ox+q.x*s,y=oy+q.y*s;ctx.strokeStyle=col;ctx.lineWidth=wid;rr(ctx,x-wid*1.2,y-wid*1.2,pw+wid*2.4,ph+wid*2.4,pw*.17+wid);ctx.stroke()};

// ui sync
const pct=document.getElementById('zpct'),panel=document.getElementById('rdpanel');
function ui(){pct.textContent=Math.round(cam.s/startS*100)+'%';
  panel.classList.toggle('on',sel>=0&&!anim||(sel>=0&&anim&&performance.now()-anim.t0>anim.ms*.6))}

  document.getElementById('pname').textContent='RD-'+String(i+1).padStart(5,'0');document.getElementById('pmodel').textContent=p.m2;
  document.getElementById('ploc').textContent='Tampa · Rack '+'ABCDEFGHIJKLMN'[Math.floor(r/4)]+' · Shelf '+(r%4+1)+' · Slot '+(i%COLS+1);
  document.getElementById('pnet').textContent='US 5G · '+p.mb+' Mbps';document.getElementById('papp').textContent='Instagram Reels · @'+REELS[Math.abs(swipeK(p,performance.now()))>.5?p.nk:p.k].u;

  document.getElementById('pup').textContent=p.up+' days';const st=document.getElementById('pstate');
  st.innerHTML='<i></i>'+['Restarting','Live','In a session'][p.s];st.style.background=['#ffb0201f','#34d27b1f','#3ea6ea1f'][p.s];st.style.color=['#ffc35a','#5fe39a','#6cc0f5'][p.s]}
// loop
let lastMin=clock(),lastD=0;

setInterval(()=>{for(let k=0;k<3;k++){const i=(Math.random()*N)|0;P[i].s=P[i].s===1?0:1}
  if(sel>=0)showPanel();if(clock()!==lastMin){lastMin=clock();buildAll()}if(ovDirty){ovDirty=0;buildAll()}},650);
// input
const ptrs=new Map();let drag=null,pinch=null,moved=0;
cv.addEventListener('pointerdown',e=>{kick();cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});anim=null;touched=true;moved=0;

function up(e){ptrs.delete(e.pointerId);cv.classList.remove('drag');if(drag&&moved<=4&&ptrs.size===0){const h=hit(e.offsetX,e.offsetY);if(h>=0)focus(h);else if(sel>=0){sel=-1;showPanel();dirty=true}}if(ptrs.size<2)pinch=null;if(ptrs.size===0)drag=null}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

function zoomAt(mx,my,f){const wx=(mx-W/2)/cam.s+cam.x,wy=(my-H/2)/cam.s+cam.y;cam.s*=f;clampCam();cam.x=wx-(mx-W/2)/cam.s;cam.y=wy-(my-H/2)/cam.s;clampCam();dirty=true}

cv.addEventListener('dblclick',e=>{const h=hit(e.offsetX,e.offsetY);if(h<0){const wx=(e.offsetX-W/2)/cam.s+cam.x,wy=(e.offsetY-H/2)/cam.s+cam.y;flyTo(wx,wy,cam.s*2.2,500)}});
const zbtn=f=>{touched=true;anim=null;flyTo(cam.x,cam.y,Math.max(minS,Math.min((H*1.25)/CH,cam.s*f)),380)};
document.getElementById('zin').onclick=()=>zbtn(2);document.getElementById('zout').onclick=()=>zbtn(.5);document.getElementById('zfit').onclick=()=>fitAll();
document.getElementById('pback').onclick=()=>fitAll();
const step=d=>{if(sel<0)return;focus((sel+d+N)%N,650)};document.getElementById('pnext').onclick=()=>step(1);document.getElementById('pprev').onclick=()=>step(-1);
const go=document.getElementById('rdgo');go.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){const n=parseInt(go.value.replace(/\D/g,''),10);if(n>=1&&n<=N){focus(n-1,1200);go.blur()}else toast('Phones are numbered 1 to '+N.toLocaleString())}});

})();
